# Caddy (HTTPS) arkasındaysak onun gönderdiği protokolü, değilse kendi şemamızı ilet.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Caddy'nin gönderdiği gerçek istemci IP'sini aynen ilet (yoksa bağlanan adres).
# Böylece API'deki giriş/takip hız sınırları her istemci için ayrı uygulanır.
map $http_x_forwarded_for $client_forwarded_for {
    default $http_x_forwarded_for;
    ''      $remote_addr;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 12m;

    # Not: nginx, kendi add_header'ı olan location bloklarına üst seviyedeki başlıkları aktarmaz;
    # bu yüzden güvenlik başlıkları her location içinde tekrar edilir.

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # React Router: bilinmeyen yollar index.html'e düşer.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
