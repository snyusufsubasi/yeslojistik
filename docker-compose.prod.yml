# Canlı sunucu: HTTPS'i Caddy otomatik alır (Let's Encrypt).
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  api:
    environment:
      Jwt__SecureCookies: "true"
      # Demo veriyle açmak için .env'de SAMPLE_DATA=true; Ayarlar → Veriler'den temizlendikten sonra bir daha yüklenmez.
      Seed__SampleData: ${SAMPLE_DATA:-false}

  web:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN ayarlanmalı (ör. panel.yeslojistik.com)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGHOST: db
      PGUSER: yeslojistik
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: yeslojistik
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: Europe/Istanbul
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
      - uploads:/uploads:ro
    # Her gece 03:00'te yedek alır.
    entrypoint: ["/bin/sh", "-c", "echo '0 3 * * * /bin/sh /backup.sh >> /backups/backup.log 2>&1' | crontab - && crond -f -l 8"]

volumes:
  caddy_data:
  caddy_config:
