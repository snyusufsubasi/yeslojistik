# Kervan Pro'ya taşıma paketi: pratikortam'dan SALT OKUMA ile indirir, ayna.json hazırlar,
# paketi yalnız Hark'ın özel anahtarıyla açılabilecek şekilde şifreler ve 1 günlük artifact yapar.
# Loga veri yazılmaz. Elle çalıştırılır.
name: Taşıma paketi (şifreli)

on:
  workflow_dispatch:
    inputs:
      pubkey_b64:
        description: "Şifreleme için RSA açık anahtar (base64)"
        required: true

permissions:
  contents: read

jobs:
  paket:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Giriş bilgilerini hazırla
        env:
          S_PASS: ${{ secrets.PASS }}
          S_PRATIK_USER: ${{ secrets.PRATIK_USER }}
          S_PRATIK_PASS: ${{ secrets.PRATIK_PASS }}
          S_PANEL_EMAIL: ${{ secrets.PANEL_EMAIL }}
          S_PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
        run: bash tools/legacy/secrets.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet openpyxl
      - name: Pratikortam'dan indir (salt okuma)
        run: node tools/legacy/extract.mjs --out "$RUNNER_TEMP/pratik" > "$RUNNER_TEMP/extract.log" 2>&1 || (tail -c 300 "$RUNNER_TEMP/extract.log" | sed 's/[0-9]\{5,\}/#/g'; exit 1)
      - name: Paketi hazırla
        run: |
          python3 tools/legacy/transform.py "$RUNNER_TEMP/pratik" --json > "$RUNNER_TEMP/transform.log" 2>&1 || { echo "transform hata verdi"; }
          mkdir -p "$RUNNER_TEMP/out"
          cp -r "$RUNNER_TEMP/pratik" "$RUNNER_TEMP/out/ham"
          cp "$RUNNER_TEMP/extract.log" "$RUNNER_TEMP/transform.log" "$RUNNER_TEMP/out/"
          ls "$RUNNER_TEMP/pratik/aktar" 2>/dev/null | wc -l
      - name: Şifrele
        env:
          PUB: ${{ inputs.pubkey_b64 }}
        run: |
          echo "$PUB" | base64 -d > "$RUNNER_TEMP/pub.pem"
          cd "$RUNNER_TEMP" && tar czf paket.tgz -C out .
          openssl rand -out key.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in paket.tgz -out paket.tgz.enc -pass file:key.bin
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -in key.bin -out key.bin.enc
          mkdir -p sifreli && mv paket.tgz.enc key.bin.enc sifreli/
          rm -rf pratik out paket.tgz key.bin
      - uses: actions/upload-artifact@v4
        with:
          name: tasima-sifreli
          path: ${{ runner.temp }}/sifreli
          retention-days: 1
