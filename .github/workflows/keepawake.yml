# Uyanık tutma: Kervan Pro (kervanpro.com) Render ücretsiz planda 15 dk boşta kalınca uyur (ilk açılış ~1 dk).
# 10 dakikada bir /api/ping çağrılır. /api/ping veritabanına DOKUNMAZ; Neon boşta uyumaya devam eder.
# yeslojistik Render servisi 13 Ekim 2026'da askıya alındı; bu iş artık Kervan Pro'yu uyanık tutuyor.
# Bu depo herkese açık olduğu için Actions dakikası ücretsizdir. GitHub zamanlanmış işleri birkaç dakika gecikebilir.
name: Uyanık tut (Kervan Pro)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepawake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS --max-time 60 https://kervanpro.com/api/ping && exit 0
            sleep 10
          done
          echo "::warning::Kervan Pro yanıt vermedi."
