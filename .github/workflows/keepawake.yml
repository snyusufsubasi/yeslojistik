# Uyanık tutma: Render ücretsiz web servisi 15 dk boşta kalınca uyur (ilk açılış ~1 dk sürer).
# İş saatlerinde (06:00–23:00 İstanbul) 10 dakikada bir /api/ping çağrılır. /api/ping veritabanına DOKUNMAZ,
# böylece Neon (ücretsiz plan, 100 CU-saat/ay) boşta uyumaya devam eder. Not: GitHub zamanlanmış işleri birkaç dakika gecikebilir.
name: Uyanık tut

on:
  # schedule kapatıldı (Actions dakikası bitti; prototip, ayna kapalı)
  # - cron: "*/10 3-19 * * *" # 06:00–22:50 İstanbul (UTC+3)
  # - cron: "0 20 * * *" # 23:00 İstanbul
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepawake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS --max-time 60 https://yeslojistik.net/api/ping && exit 0
            sleep 10
          done
          echo "::warning::Sunucu yanıt vermedi."
